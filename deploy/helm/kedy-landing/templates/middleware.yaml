{{- if and .Values.ingress.enabled .Values.ingress.redirects.httpToHttps }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "kedy-landing.fullname" . }}-https-redirect
  labels:
    {{- include "kedy-landing.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.redirects.wwwToApex }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "kedy-landing.fullname" . }}-www-redirect
  labels:
    {{- include "kedy-landing.labels" . | nindent 4 }}
spec:
  redirectRegex:
    regex: {{ .Values.ingress.redirects.wwwRegex | quote }}
    replacement: {{ .Values.ingress.redirects.wwwReplacement | quote }}
    permanent: true
{{- end }}
